name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-tests:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, mbstring
      - name: Lint PHP files
        run: |
          php -l riviantrackr-passkeys.php
          php -l uninstall.php
          find includes/ lib/ -name '*.php' -exec php -l {} \;
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  integration:
    name: Integration (WordPress ${{ matrix.wp }}, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            wp: 'latest'
          - php-version: '8.4'
            wp: 'latest'
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, mbstring, mysqli
      - name: Install Subversion (the test library is fetched from develop.svn.wordpress.org)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion
      - name: Install WordPress and its test library
        run: bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true
      - run: composer install --no-interaction --prefer-dist -d tests/integration
      - run: tests/integration/vendor/bin/phpunit -c phpunit.integration.xml

  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr
      - name: Install WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs:"^3.0" phpcompatibility/phpcompatibility-wp:"*" dealerdirect/phpcodesniffer-composer-installer:"^1.0"
      - name: Run PHPCS
        run: $(composer global config bin-dir --absolute)/phpcs -q --standard=.phpcs.xml --report=checkstyle | cs2pr

  assets:
    name: JS tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify minified assets are committed
        run: git diff --exit-code -- assets/
